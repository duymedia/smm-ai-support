name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type-check
        run: npm run lint

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to VPS
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_VPS }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -e
            APP_DIR=/var/www/smm-ai-support

            # 1. Tạo thư mục và clone mã nguồn nếu chưa có
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "[CI/CD] Thư mục dự án chưa tồn tại, đang clone repository..."
              mkdir -p /var/www
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            # 2. Cập nhật mã nguồn mới nhất từ branch main
            echo "[CI/CD] Cập nhật mã nguồn mới nhất..."
            git fetch origin main
            git reset --hard origin/main

            # 3. Tạo file .env nếu chưa có
            if [ ! -f "$APP_DIR/.env" ]; then
              echo "[CI/CD] Tạo file .env từ .env.example..."
              cp "$APP_DIR/.env.example" "$APP_DIR/.env"
            fi

            # 4. Cài đặt dependencies và build
            echo "[CI/CD] Cài đặt dependencies và build..."
            npm install --no-audit --no-fund
            npx prisma generate
            npx prisma db push --skip-generate --accept-data-loss
            npm run build

            # 5. Khởi chạy / Reload bằng PM2
            if command -v pm2 >/dev/null 2>&1; then
              echo "[CI/CD] Khởi động ứng dụng qua PM2..."
              pm2 restart smm-ai-support --update-env || pm2 start dist/server.cjs --name smm-ai-support
              pm2 save
            else
              echo "[CI/CD ERROR] PM2 chưa được cài đặt trên VPS. Chạy: npm install -g pm2"
              exit 1
            fi
