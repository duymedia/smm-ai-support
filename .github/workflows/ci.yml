name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type-check
        run: npm run lint

      - name: Build application
        run: npm run build

  deploy:
    name: Deploy to VPS with Docker
    needs: validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_VPS }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: 22
          script_stop: true
          script: |
            set -e

            # 1. Xác định thư mục dự án trên VPS
            if [ -d "$HOME/smm-ai-support/.git" ] && [ ! -d "/var/www/smm-ai-support/.git" ]; then
              APP_DIR="$HOME/smm-ai-support"
            else
              APP_DIR="/var/www/smm-ai-support"
            fi

            # 2. Tạo thư mục và clone nếu chưa có
            if [ ! -d "$APP_DIR/.git" ]; then
              echo "[CI/CD] Thư mục dự án chưa tồn tại, đang clone repository..."
              mkdir -p /var/www
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi

            cd "$APP_DIR"

            # 3. Cập nhật mã nguồn mới nhất
            echo "[CI/CD] Pull code mới nhất từ git..."
            git fetch origin main || git fetch origin master
            git reset --hard origin/main 2>/dev/null || git reset --hard origin/master

            # 4. Tạo file .env nếu chưa có
            if [ ! -f "$APP_DIR/.env" ]; then
              echo "[CI/CD] Tạo file .env từ .env.example..."
              cp "$APP_DIR/.env.example" "$APP_DIR/.env"
            fi

            # 5. Kiểm tra Docker & Docker Compose
            if ! command -v docker >/dev/null 2>&1; then
              echo "[CI/CD] Đang cài đặt Docker trên VPS..."
              curl -fsSL https://get.docker.com | sh
            fi

            # 6. Rebuild và Restart toàn bộ hệ thống bằng Docker Compose
            echo "[CI/CD] Đang build và khởi chạy containers..."
            docker compose up -d --build --remove-orphans

            # 7. Dọn dẹp images cũ thừa
            docker image prune -f

            echo "[CI/CD] ✅ Triển khai Docker thành công!"

